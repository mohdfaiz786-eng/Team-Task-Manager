<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Team Task Manager Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideIn {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }
        
        .card, .stat-card, .project-item, .task-item {
            animation: fadeIn 0.5s ease;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h2 {
            color: #667eea;
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
        }
        
        input, select {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .link {
            text-align: center;
            margin-top: 15px;
        }
        
        .link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .message {
            padding: 12px;
            border-radius: 12px;
            margin-top: 15px;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        
        .error { background: #fee2e2; color: #dc2626; border-left: 4px solid #dc2626; }
        .success { background: #d1fae5; color: #059669; border-left: 4px solid #059669; }
        .info { background: #dbeafe; color: #2563eb; border-left: 4px solid #2563eb; }
        
        .dashboard {
            display: none;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .navbar {
            background: white;
            border-radius: 20px;
            padding: 15px 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .navbar h2 {
            margin: 0;
            font-size: 24px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .logout-btn {
            background: #ef4444;
            width: auto;
            padding: 8px 20px;
        }
        
        .logout-btn:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        .stat-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-card.overdue .stat-number {
            color: #ef4444;
        }
        
        .section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .section h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        
        .form-row input, .form-row select {
            flex: 1;
            min-width: 150px;
            margin: 0;
        }
        
        .form-row button {
            flex: 0.3;
            min-width: 100px;
            margin: 0;
        }
        
        .project-item, .task-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .project-item:hover, .task-item:hover {
            transform: translateX(5px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .project-header, .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }
        
        .delete-btn {
            background: #ef4444;
            width: auto;
            padding: 5px 15px;
            margin: 0;
            font-size: 12px;
        }
        
        .status-select {
            width: auto;
            padding: 5px 10px;
            margin: 0;
            font-size: 12px;
        }
        
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        
        .badge-todo { background: #fef3c7; color: #d97706; }
        .badge-progress { background: #dbeafe; color: #2563eb; }
        .badge-done { background: #d1fae5; color: #059669; }
        .badge-overdue { background: #fee2e2; color: #dc2626; }
        
        .priority-high { border-left: 4px solid #ef4444; }
        .priority-medium { border-left: 4px solid #f59e0b; }
        .priority-low { border-left: 4px solid #10b981; }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .card { padding: 25px; margin: 10px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .form-row { flex-direction: column; }
            .form-row button { width: 100%; }
            .navbar { flex-direction: column; text-align: center; }
            .user-info { justify-content: center; }
            .project-header, .task-header { flex-direction: column; align-items: flex-start; }
        }
        
        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- Loading Spinner -->
    <div id="loading" class="loading" style="display: none;">⏳ Loading...</div>
    
    <!-- Login/Signup Container -->
    <div id="authContainer">
        <div class="card">
            <h2 id="formTitle">✨ Welcome</h2>
            <input type="text" id="name" placeholder="Full Name">
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            <select id="role">
                <option value="member">👤 Member</option>
                <option value="admin">👑 Admin</option>
            </select>
            <button onclick="submitAuth()" id="submitBtn">Create Account</button>
            <div class="link">
                <a href="#" onclick="toggleForm()" id="toggleLink">Already have an account? Login</a>
            </div>
            <div id="message"></div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="dashboard">
        <div class="navbar">
            <h2>📊 Team Task Manager Pro</h2>
            <div class="user-info">
                <span id="userName" style="font-weight: 500;"></span>
                <button class="logout-btn" onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid" id="statsGrid"></div>

        <!-- Create Project Section -->
        <div class="section">
            <h3>📁 Create New Project</h3>
            <div class="form-row">
                <input type="text" id="projectName" placeholder="Project Name">
                <input type="text" id="projectDesc" placeholder="Description">
                <button onclick="createProject()">➕ Create</button>
            </div>
        </div>

        <!-- Projects List -->
        <h3 style="color: white; margin: 20px 0 10px;">📋 My Projects</h3>
        <div id="projectsList"></div>

        <!-- Create Task Section -->
        <div class="section">
            <h3>✅ Create New Task</h3>
            <div class="form-row">
                <input type="text" id="taskTitle" placeholder="Task Title">
                <input type="text" id="taskDesc" placeholder="Description">
                <select id="taskProject"></select>
                <select id="taskPriority">
                    <option value="low">🟢 Low Priority</option>
                    <option value="medium">🟡 Medium Priority</option>
                    <option value="high">🔴 High Priority</option>
                </select>
                <input type="date" id="taskDueDate">
                <button onclick="createTask()">✨ Create Task</button>
            </div>
        </div>

        <!-- Tasks List -->
        <h3 style="color: white; margin: 20px 0 10px;">📝 My Tasks</h3>
        <div id="tasksList"></div>
    </div>

    <script>
        // ========== CONFIGURATION ==========
        // Railway deployed backend URL
        const API_URL = 'https://team-task-manager-production-fe6b.up.railway.app/api';
        
        // For local testing, uncomment below:
        // const API_URL = 'http://localhost:3000/api';
        
        let token = localStorage.getItem('token');
        let currentUser = null;
        
        // ========== HELPER FUNCTIONS ==========
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }
        
        // ========== API FETCH ==========
        async function fetchAPI(endpoint, options = {}) {
            try {
                const res = await fetch(API_URL + endpoint, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...(token && { 'Authorization': `Bearer ${token}` }),
                        ...options.headers
                    }
                });
                return await res.json();
            } catch (error) {
                console.error('API Error:', error);
                showToast('❌ Network error. Check if server is running.', 'error');
                throw error;
            }
        }
        
        // ========== AUTH FUNCTIONS ==========
        let isLogin = false;
        
        function toggleForm() {
            isLogin = !isLogin;
            if (isLogin) {
                document.getElementById('formTitle').innerHTML = '🔐 Login';
                document.getElementById('submitBtn').innerHTML = 'Login';
                document.getElementById('name').style.display = 'none';
                document.getElementById('role').style.display = 'none';
                document.getElementById('toggleLink').innerHTML = "✨ Don't have an account? Signup";
            } else {
                document.getElementById('formTitle').innerHTML = '✨ Welcome';
                document.getElementById('submitBtn').innerHTML = 'Create Account';
                document.getElementById('name').style.display = 'block';
                document.getElementById('role').style.display = 'block';
                document.getElementById('toggleLink').innerHTML = "🔐 Already have an account? Login";
            }
        }
        
        async function submitAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            if (!email || !password) {
                messageDiv.innerHTML = '<div class="message error">❌ Please fill all fields</div>';
                return;
            }
            
            showLoading(true);
            
            try {
                if (isLogin) {
                    // LOGIN
                    const res = await fetch(`${API_URL}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();
                    
                    if (data.success) {
                        token = data.token;
                        currentUser = data.user;
                        localStorage.setItem('token', token);
                        localStorage.setItem('user', JSON.stringify(currentUser));
                        document.getElementById('authContainer').style.display = 'none';
                        document.getElementById('dashboard').style.display = 'block';
                        document.getElementById('userName').innerHTML = `👋 Welcome, ${currentUser.name}`;
                        showToast(`✅ Welcome back, ${currentUser.name}!`, 'success');
                        loadAllData();
                    } else {
                        messageDiv.innerHTML = `<div class="message error">❌ ${data.message}</div>`;
                    }
                } else {
                    // SIGNUP
                    const name = document.getElementById('name').value.trim();
                    const role = document.getElementById('role').value;
                    
                    if (!name) {
                        messageDiv.innerHTML = '<div class="message error">❌ Please enter your name</div>';
                        showLoading(false);
                        return;
                    }
                    
                    const res = await fetch(`${API_URL}/auth/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, password, role })
                    });
                    const data = await res.json();
                    
                    if (data.success) {
                        messageDiv.innerHTML = '<div class="message success">✅ Account created! Please login.</div>';
                        showToast('✅ Signup successful! Please login.', 'success');
                        setTimeout(() => toggleForm(), 1500);
                        document.getElementById('email').value = '';
                        document.getElementById('password').value = '';
                    } else {
                        messageDiv.innerHTML = `<div class="message error">❌ ${data.message}</div>`;
                    }
                }
            } catch (error) {
                messageDiv.innerHTML = '<div class="message error">❌ Server error. Backend may be starting up. Please wait 30 seconds and try again.</div>';
                showToast('❌ Backend connection failed', 'error');
            } finally {
                showLoading(false);
            }
        }
        
        // ========== DASHBOARD FUNCTIONS ==========
        async function loadAllData() {
            await loadStats();
            await loadProjects();
            await loadTasks();
            await loadProjectSelect();
        }
        
        async function loadStats() {
            try {
                const data = await fetchAPI('/tasks/dashboard');
                if (data.success) {
                    const s = data.data;
                    document.getElementById('statsGrid').innerHTML = `
                        <div class="stat-card"><h3>📁 Projects</h3><div class="stat-number">${s.totalProjects || 0}</div></div>
                        <div class="stat-card"><h3>📝 Total Tasks</h3><div class="stat-number">${s.totalTasks || 0}</div></div>
                        <div class="stat-card"><h3>⏳ To Do</h3><div class="stat-number">${s.todoTasks || 0}</div></div>
                        <div class="stat-card"><h3>🔄 In Progress</h3><div class="stat-number">${s.progressTasks || 0}</div></div>
                        <div class="stat-card"><h3>✅ Done</h3><div class="stat-number">${s.doneTasks || 0}</div></div>
                        <div class="stat-card overdue"><h3>⚠️ Overdue</h3><div class="stat-number">${s.overdueTasks || 0}</div></div>
                    `;
                }
            } catch (error) {
                console.error('Stats error:', error);
            }
        }
        
        async function loadProjects() {
            try {
                const data = await fetchAPI('/projects');
                if (data.success && data.data) {
                    const projects = data.data;
                    const container = document.getElementById('projectsList');
                    if (projects.length === 0) {
                        container.innerHTML = '<div class="project-item" style="text-align:center; color:#666;">📭 No projects yet. Create your first project above! ✨</div>';
                        return;
                    }
                    container.innerHTML = projects.map(p => `
                        <div class="project-item priority-${p.priority || 'medium'}">
                            <div class="project-header">
                                <strong style="font-size: 16px;">📌 ${p.name}</strong>
                                <button class="delete-btn" onclick="deleteProject('${p._id}')">🗑️ Delete</button>
                            </div>
                            <p style="color:#666; margin: 8px 0;">${p.description}</p>
                            <div style="display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px;">
                                <span class="badge badge-${p.status === 'active' ? 'todo' : 'done'}">${p.status || 'active'}</span>
                                <span>👥 Members: ${p.members?.length || 1}</span>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Projects error:', error);
            }
        }
        
        async function loadTasks() {
            try {
                const data = await fetchAPI('/tasks');
                if (data.success && data.data) {
                    const tasks = data.data;
                    const container = document.getElementById('tasksList');
                    if (tasks.length === 0) {
                        container.innerHTML = '<div class="task-item" style="text-align:center; color:#666;">✅ No tasks assigned. Create a task above! 🚀</div>';
                        return;
                    }
                    const now = new Date();
                    container.innerHTML = tasks.map(t => {
                        const isOverdue = new Date(t.dueDate) < now && t.status !== 'done';
                        return `
                            <div class="task-item priority-${t.priority || 'medium'}">
                                <div class="task-header">
                                    <strong style="font-size: 15px;">✓ ${t.title}</strong>
                                    <select class="status-select" onchange="updateStatus('${t._id}', this.value)">
                                        <option value="todo" ${t.status === 'todo' ? 'selected' : ''}>⏳ To Do</option>
                                        <option value="progress" ${t.status === 'progress' ? 'selected' : ''}>🔄 In Progress</option>
                                        <option value="done" ${t.status === 'done' ? 'selected' : ''}>✅ Done</option>
                                    </select>
                                </div>
                                <p style="color:#666; margin: 8px 0;">${t.description}</p>
                                <div style="display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px;">
                                    <span class="badge badge-${t.status}">${t.status}</span>
                                    ${isOverdue ? '<span class="badge badge-overdue">⚠️ OVERDUE</span>' : ''}
                                    <span>📅 Due: ${new Date(t.dueDate).toLocaleDateString()}</span>
                                    <span>🎯 Priority: ${t.priority}</span>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (error) {
                console.error('Tasks error:', error);
            }
        }
        
        async function loadProjectSelect() {
            try {
                const data = await fetchAPI('/projects');
                if (data.success && data.data) {
                    const select = document.getElementById('taskProject');
                    select.innerHTML = '<option value="">📁 Select Project</option>' + 
                        data.data.map(p => `<option value="${p._id}">📌 ${p.name}</option>`).join('');
                }
            } catch (error) {
                console.error('Project select error:', error);
            }
        }
        
        // ========== CRUD OPERATIONS ==========
        async function createProject() {
            const name = document.getElementById('projectName').value.trim();
            const description = document.getElementById('projectDesc').value.trim();
            
            if (!name || !description) {
                alert('❌ Please fill both project name and description!');
                return;
            }
            
            showLoading(true);
            try {
                const data = await fetchAPI('/projects', {
                    method: 'POST',
                    body: JSON.stringify({ name, description })
                });
                if (data.success) {
                    document.getElementById('projectName').value = '';
                    document.getElementById('projectDesc').value = '';
                    loadAllData();
                    showToast('✅ Project created successfully!', 'success');
                } else {
                    alert('❌ Error: ' + data.message);
                }
            } catch (error) {
                alert('❌ Failed to create project. Check connection.');
            } finally {
                showLoading(false);
            }
        }
        
        async function createTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const description = document.getElementById('taskDesc').value.trim();
            const projectId = document.getElementById('taskProject').value;
            const priority = document.getElementById('taskPriority').value;
            const dueDate = document.getElementById('taskDueDate').value;
            
            if (!title || !description || !projectId || !dueDate) {
                alert('❌ Please fill all task fields and select a project!');
                return;
            }
            
            showLoading(true);
            try {
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                const data = await fetchAPI('/tasks', {
                    method: 'POST',
                    body: JSON.stringify({ title, description, projectId, assignedTo: user.id, dueDate, priority })
                });
                if (data.success) {
                    document.getElementById('taskTitle').value = '';
                    document.getElementById('taskDesc').value = '';
                    document.getElementById('taskDueDate').value = '';
                    loadAllData();
                    showToast('✅ Task created successfully!', 'success');
                } else {
                    alert('❌ Error: ' + data.message);
                }
            } catch (error) {
                alert('❌ Failed to create task.');
            } finally {
                showLoading(false);
            }
        }
        
        async function updateStatus(taskId, status) {
            showLoading(true);
            try {
                await fetchAPI(`/tasks/${taskId}/status`, {
                    method: 'PUT',
                    body: JSON.stringify({ status })
                });
                loadAllData();
                showToast(`✅ Task status updated to ${status}`, 'success');
            } catch (error) {
                alert('❌ Failed to update status');
            } finally {
                showLoading(false);
            }
        }
        
        async function deleteProject(projectId) {
            if (confirm('⚠️ Delete this project and all its tasks? This cannot be undone!')) {
                showLoading(true);
                try {
                    await fetchAPI(`/projects/${projectId}`, { method: 'DELETE' });
                    loadAllData();
                    showToast('✅ Project deleted successfully', 'success');
                } catch (error) {
                    alert('❌ Failed to delete project');
                } finally {
                    showLoading(false);
                }
            }
        }
        
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            location.reload();
        }
        
        // ========== INITIAL CHECK ==========
        // Check stored user session
        const stored = localStorage.getItem('user');
        if (stored && token) {
            currentUser = JSON.parse(stored);
            document.getElementById('userName').innerHTML = `👋 Welcome, ${currentUser.name}`;
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadAllData();
        }
    </script>
</body>
</html>
